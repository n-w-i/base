[project]
name = "calendar-intel"
version = "0.1.0"
description = "Google Calendar event classifier and forecast for Base modules"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
calendar-intel = "calendar_intel.cli:main"
calendar-intel-mcp = "calendar_intel.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
