[project]
name = "hevy-intel"
version = "0.1.0"
description = "Local Hevy data service — syncs workouts and derives per-muscle-group fatigue for Base modules"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
hevy-intel = "hevy_intel.cli:main"
hevy-intel-mcp = "hevy_intel.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
