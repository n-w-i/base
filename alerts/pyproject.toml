[project]
name = "alerts"
version = "0.1.0"
description = "Proactive macOS notifications for Base — recovery, risky days, and bedtime reminders"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
alerts = "alerts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
