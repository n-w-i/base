[project]
name = "recovery-forecast"
version = "0.1.0"
description = "Multi-day recovery prediction using WHOOP data and calendar context"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp[cli]>=1.0",
]

[project.scripts]
recovery-forecast = "recovery_forecast.cli:main"
recovery-forecast-mcp = "recovery_forecast.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
