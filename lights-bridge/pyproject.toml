[project]
name = "lights-bridge"
version = "0.1.0"
description = "Smart light dimming at bedtime based on WHOOP sleep need"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
lights-bridge = "lights_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
