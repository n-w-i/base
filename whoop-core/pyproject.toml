[project]
name = "whoop-core"
version = "0.1.0"
description = "Local WHOOP data service — OAuth, sync, and REST API for Tempo modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "keyring>=25.0",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
whoop-core = "whoop_core.cli:main"
whoop-mcp = "whoop_core.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
